<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<meta name="description" content="{{DESCRIPTION}}">
<link rel="canonical" href="https://kouhei1970.github.io/qwen-note/">

<!-- OGP -->
<meta property="og:title" content="{{TITLE}}">
<meta property="og:description" content="{{DESCRIPTION}}">
<meta property="og:type" content="article">
<meta property="og:url" content="https://kouhei1970.github.io/qwen-note/">
<meta property="og:image" content="https://kouhei1970.github.io/qwen-note/assets/og-card.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:locale" content="ja_JP">

<!-- Twitter Card -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{TITLE}}">
<meta name="twitter:description" content="{{DESCRIPTION}}">
<meta name="twitter:image" content="https://kouhei1970.github.io/qwen-note/assets/og-card.png">

<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<header class="hero">
  <div class="hero-inner">
    <p class="hero-eyebrow">kouhei1970 / qwen-note</p>
    <h1 class="hero-title">{{TITLE}}</h1>
    <p class="hero-desc">{{DESCRIPTION}}</p>
    <div class="hero-meta">
      <a class="btn-github" href="https://github.com/kouhei1970/qwen-note" target="_blank" rel="noopener noreferrer">GitHub で見る</a>
      <span class="hero-updated">更新日: {{UPDATED}}</span>
    </div>
  </div>
</header>

<div class="layout">
  <nav class="toc" aria-label="目次">
    <p class="toc-heading">目次</p>
    {{TOC}}
  </nav>

  <article class="content">
{{CONTENT}}
  </article>
</div>

<footer class="site-footer">
  <p>&copy; 2026 kouhei1970 &middot; 設定/スクリプト: MIT &middot; 本文: CC BY 4.0</p>
</footer>

</body>
</html>
